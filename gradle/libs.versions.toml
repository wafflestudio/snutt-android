[versions]
# Kotlin & Android
kotlin = "2.3.21"
androidGradle = "9.2.1"
composeScreenshot = "0.0.1-alpha14"

# Build tools
ktlintGradle = "14.2.0"
hilt = "2.59.2"
ksp = "2.3.5"

# Networking
retrofit = "3.0.0"
moshi = "1.15.2"
okhttp = "5.3.2"

# Jetpack Compose
composeBom = "2026.03.01"
composeMaterialNavigation = "1.11.1"
navigation = "2.9.8"
lifecycle = "2.10.0"
hiltNavigationCompose = "1.3.0"

# Paging
pagingCompose = "3.5.0"

# Firebase
firebaseBom = "34.13.0"
googleServices = "4.4.4"
firebaseAppdistribution = "5.2.1"
firebaseCrashlytics = "3.0.7"

# UI & Graphics
coil = "2.7.0"
splashscreen = "1.2.0"

# Authentication
facebookLogin = "15.0.1"
googleAuth = "21.5.1"
googleId = "1.2.0"
kakaoSDK = "2.23.2"

# Maps
naverMap = "3.22.0"
naverMapCompose = "1.9.0"

# Misc
androidxCore = "1.18.0"
material = "1.13.0"
timber = "5.0.1"
gson = "2.13.2"
kotlinxSerialization = "1.11.0"
desugarJdkLibs = "2.1.5"
junit = "4.13.2"
coroutinesTest = "1.10.2"
turbine = "1.2.1"
kotlinTest = "2.3.10"
robolectric = "4.15.1"

# Haze
haze = "1.7.2"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# Android Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# Networking
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# JSON
moshi = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Dependency Injection
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# Navigation
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Compose BOM
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material = { module = "androidx.compose.material:material" }
compose-material-navigation = { module = "androidx.compose.material:material-navigation", version.ref = "composeMaterialNavigation" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# Lifecycle
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Paging
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "pagingCompose" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

# Image Loading
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Authentication
facebook-login = { module = "com.facebook.android:facebook-login", version.ref = "facebookLogin" }
google-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "googleAuth" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
kakao-share = { module = "com.kakao.sdk:v2-share", version.ref = "kakaoSDK" }
kakao-user = { module = "com.kakao.sdk:v2-user", version.ref = "kakaoSDK" }

# Maps
naver-map = { module = "com.naver.maps:map-sdk", version.ref = "naverMap" }
naver-map-compose = { module = "io.github.fornewid:naver-map-compose", version.ref = "naverMapCompose" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Misc
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlinTest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Haze
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

# Compose Preview Screenshot Test
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "composeScreenshot" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradle" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
firebase-appdistribution = { id = "com.google.firebase.appdistribution", version.ref = "firebaseAppdistribution" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-screenshot = { id = "com.android.compose.screenshot", version.ref = "composeScreenshot" }

[bundles]
retrofit = [
    "retrofit",
    "retrofit-converter-moshi",
    "okhttp-logging-interceptor"
]

compose = [
    "compose-runtime",
    "compose-ui",
    "compose-ui-tooling",
    "compose-material",
    "compose-foundation",
    "compose-foundation-layout",
    "compose-material-icons-core"
]

lifecycle = [
    "lifecycle-viewmodel-compose",
    "lifecycle-runtime-compose"
]

firebase = [
    "firebase-messaging",
    "firebase-analytics",
    "firebase-crashlytics"
]

kakao = [
    "kakao-share",
    "kakao-user"
]

kotlin-core = [
    "kotlin-stdlib",
    "kotlin-reflect"
]