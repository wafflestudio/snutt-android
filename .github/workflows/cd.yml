name: CD

on:
  push:
    branches:
      - 'release-*'
    paths:
      - 'version.properties'

jobs:
  build-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'jetbrains'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup secrets
        uses: ./.github/actions/setup-secrets
        with:
          variant: live
          google_services_json: ${{ secrets.google_services_json_live }}
          secrets_xml_app: ${{ secrets.secrets_xml_live }}
          gcp_service_account: ${{ secrets.app_distribution_service_account_live }}
          keystore_base64: ${{ secrets.KEYSTORE }}
      - name: Build production apk
        run: ./gradlew bundleLiveRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      - name: Upload artifact to Firebase App Distribution
        id: firebase-distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_LIVE }}
          serviceCredentialsFile: ./gcp-service-account-live.json
          groups: android-user
          file: ./app/build/outputs/bundle/liveRelease/app-live-release.aab
      - name: Set Message
        run: |
          PROPERTY=$(head -n 1 version.properties)
          VERSION="${PROPERTY/snuttVersionName=}"
          TITLE="SNUTT Android 빌드 알림"
          MESSAGE="${VERSION} 빌드 완료"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "MESSAGE=$MESSAGE" >> $GITHUB_ENV
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: ${{ env.TITLE }}
          SLACK_MESSAGE: ${{ env.MESSAGE }}
          SLACK_USERNAME: BuildNoti
      - name: Prepare Discord notification
        id: discord-message
        env:
          VERSION: ${{ env.VERSION }}
          FIREBASE_CONSOLE_URI: ${{ steps.firebase-distribution.outputs.FIREBASE_CONSOLE_URI }}
        run: |
          {
            echo 'content<<EOF'
            echo "**SNUTT Android 빌드 알림**"
            echo "${VERSION} Live 빌드 완료"
            echo
            if [ -n "$FIREBASE_CONSOLE_URI" ]; then
              echo "[Firebase 배포 정보]($FIREBASE_CONSOLE_URI)"
            fi
            echo "[빌드 로그](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Discord Notification
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: BuildNoti
          content: ${{ steps.discord-message.outputs.content }}

  build-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'jetbrains'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup secrets
        uses: ./.github/actions/setup-secrets
        with:
          variant: dev
          google_services_json: ${{ secrets.google_services_json_dev }}
          secrets_xml_app: ${{ secrets.secrets_xml_dev }}
          gcp_service_account: ${{ secrets.app_distribution_service_account_dev }}
          keystore_base64: ${{ secrets.KEYSTORE }}
      - name: Build production apk
        run: ./gradlew assembleDevRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      - name: Upload artifact to Firebase App Distribution
        id: firebase-distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_DEV }}
          serviceCredentialsFile: ./gcp-service-account-dev.json
          groups: android-users
          file: ./app/build/outputs/apk/dev/release/app-dev-release.apk
      - name: Slack Upload APK
        uses: MeilCli/slack-upload-file@v5
        with:
          slack_token: ${{ secrets.SLACK_READ_WRITE_TOKEN }}
          channel_id: ${{ secrets.SLACK_DEPLOY_CHANNEL_ID }}
          file_path: './app/build/outputs/apk/dev/release/app-dev-release.apk'
          file_name: 'app-dev-release.apk'
          file_type: 'apk'
          initial_comment: 'dev-release APK'
      - name: Prepare Discord notification
        id: discord-message
        env:
          TESTING_URI: ${{ steps.firebase-distribution.outputs.TESTING_URI }}
          BINARY_DOWNLOAD_URI: ${{ steps.firebase-distribution.outputs.BINARY_DOWNLOAD_URI }}
          FIREBASE_CONSOLE_URI: ${{ steps.firebase-distribution.outputs.FIREBASE_CONSOLE_URI }}
        run: |
          PROPERTY=$(head -n 1 version.properties)
          VERSION="${PROPERTY/snuttVersionName=}"

          {
            echo 'content<<EOF'
            echo "**SNUTT Android 빌드 알림**"
            echo "${VERSION} Dev 빌드 완료"
            echo
            if [ -n "$TESTING_URI" ]; then
              echo "[APK 설치하기]($TESTING_URI)"
            fi
            if [ -n "$BINARY_DOWNLOAD_URI" ]; then
              echo "[직접 다운로드 — 1시간 유효]($BINARY_DOWNLOAD_URI)"
            fi
            if [ -n "$FIREBASE_CONSOLE_URI" ]; then
              echo "[Firebase 배포 정보]($FIREBASE_CONSOLE_URI)"
            fi
            echo "[빌드 로그](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Discord Notification
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: BuildNoti
          content: ${{ steps.discord-message.outputs.content }}
