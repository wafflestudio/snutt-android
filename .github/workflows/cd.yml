name: CD

on:
  push:
    branches:
      - 'release-*'
    paths:
      - 'version.properties'

jobs:
  build-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup secrets
        uses: ./.github/actions/setup-secrets
        with:
          variant: live
          google_services_json: ${{ secrets.google_services_json_live }}
          secrets_xml_app: ${{ secrets.secrets_xml_live }}
          gcp_service_account: ${{ secrets.app_distribution_service_account_live }}
          keystore_base64: ${{ secrets.KEYSTORE }}
      - name: Build production apk
        run: ./gradlew bundleLiveRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      - name: Upload artifact to Firebase App Distribution
        run: ./gradlew appDistributionUploadLiveRelease
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_LIVE }}
      - name: Set Message
        run: |
          PROPERTY=$(head -n 1 version.properties)
          VERSION="${PROPERTY/snuttVersionName=}"
          TITLE="SNUTT Android 빌드 알림"
          MESSAGE="${VERSION} 빌드 완료"
          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "MESSAGE=$MESSAGE" >> $GITHUB_ENV
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: ${{ env.TITLE }}
          SLACK_MESSAGE: ${{ env.MESSAGE }}
          SLACK_USERNAME: BuildNoti

  build-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup secrets
        uses: ./.github/actions/setup-secrets
        with:
          variant: staging
          google_services_json: ${{ secrets.google_services_json_staging }}
          secrets_xml_app: ${{ secrets.secrets_xml_staging }}
          gcp_service_account: ${{ secrets.app_distribution_service_account_staging }}
          keystore_base64: ${{ secrets.KEYSTORE }}
      - name: Build production apk
        run: ./gradlew assembleStagingRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      - name: Upload artifact to Firebase App Distribution
        run: ./gradlew appDistributionUploadStagingRelease
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_STAGING }}
      - name: Slack Upload APK
        uses: MeilCli/slack-upload-file@v3
        with:
          slack_token: ${{ secrets.SLACK_READ_WRITE_TOKEN }}
          channel_id: ${{ secrets.SLACK_DEPLOY_CHANNEL_ID }}
          file_path: './app/build/outputs/apk/staging/release/app-staging-release.apk'
          file_name: 'app-staging-release.apk'
          file_type: 'apk'
          initial_comment: 'staging-release APK'
