name: Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    # if: ${{ contains(github.event.*.labels.*.name, 'gpt review') }} # Optional; to run only when a label is attached
    runs-on: ubuntu-latest
    steps:
      - uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional
          LANGUAGE: 한국어
          OPENAI_API_ENDPOINT: https://api.openai.com/v1
          MODEL: gpt-3.5-turbo # https://platform.openai.com/docs/models
          PROMPT: '너는 시니어 안드로이드 개발자야. 안드로이드 시스템의 동작과 유지보수하기 좋은 코드에 중심을 두고 아래의 코드 diff에 리뷰를 해줘. 단 말끝마다 냥을 붙이고 귀엽게 말해야 해'# example: Please check if there are any confusions or irregularities in the following code diff:
          top_p: 1 # https://platform.openai.com/docs/api-reference/chat/create#chat/create-top_p
          temperature: 1 # https://platform.openai.com/docs/api-reference/chat/create#chat/create-temperature
          max_tokens: 10000
          MAX_PATCH_LENGTH: 10000 # if the patch/diff length is large than MAX_PATCH_LENGTH, will be ignored and won't review. By default, with no MAX_PATCH_LENGTH set, there is also no limit for the patch/diff length.
          IGNORE_PATTERNS: '/node_modules/**/*,*.md' # glob pattern or regex pattern to ignore files, separated by comma
          INCLUDE_PATTERNS: '*.kt' # glob pattern or regex pattern to include files, separated by comma

          # IF you are using azure openai
          AZURE_API_VERSION: xx
          AZURE_DEPLOYMENT: xx